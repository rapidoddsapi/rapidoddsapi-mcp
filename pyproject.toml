[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rapidoddsapi-mcp"
dynamic = ["version"]
description = "MCP server for RapidOddsAPI: bookmaker odds, live scores, arbitrage and value bets."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "RapidOddsAPI", email = "support@rapidoddsapi.com" }]
keywords = ["mcp", "odds", "betting", "bookmaker", "arbitrage", "sports"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "mcp>=2.0.0",
    "rapidoddsapi>=0.2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
rapidoddsapi-mcp = "rapidoddsapi_mcp.server:main"

[project.urls]
Homepage = "https://rapidoddsapi.com"
Documentation = "https://rapidoddsapi.com/docs"
Repository = "https://github.com/rapidoddsapi/rapidoddsapi-mcp"

[tool.hatch.version]
path = "src/rapidoddsapi_mcp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/rapidoddsapi_mcp"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
